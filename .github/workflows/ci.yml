name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Correr pytest con cobertura
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  e2e-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      FLASK_ENV: testing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Preparar base de datos
        run: python scripts/database_setup.py

      - name: Arrancar la app en segundo plano
        run: |
          nohup python run.py &
          sleep 3

      - name: Verificar que la app responde
        run: curl --fail http://localhost:5000/api/health

      - name: Correr pruebas Selenium (headless)
        run: python -m pytest tests/e2e/ -v

  docker-build:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen Docker
        run: docker build -t mrs-app .

  security-scan:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Escaneo de dependencias vulnerables
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true